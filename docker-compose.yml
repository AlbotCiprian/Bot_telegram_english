services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: allengual-telegram-bot-api
    env_file:
      - .env.local
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_LOCAL_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_LOCAL_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_HTTP_PORT: "8081"
      TELEGRAM_STAT: "1"
      TELEGRAM_STAT_PORT: "8082"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
      - "8082:8082"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: allengual-postgres
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: botdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d botdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: allengual-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: allengual-bot
    command: npm run dev
    env_file:
      - .env.local
    depends_on:
      telegram-bot-api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./stream:/srv/stream

  worker:
    build: .
    container_name: allengual-worker
    command: npm run worker
    env_file:
      - .env.local
    depends_on:
      telegram-bot-api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./stream:/srv/stream

  ops-bot:
    build: .
    container_name: allengual-ops-bot
    command: npm run ops-bot
    env_file:
      - .env.local
    depends_on:
      bot:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - ./stream:/srv/stream

  stream-edge:
    image: nginx:alpine
    container_name: allengual-stream-edge
    depends_on:
      bot:
        condition: service_started
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/stream.conf:/etc/nginx/conf.d/default.conf:ro
      - ./stream:/srv/stream:ro

volumes:
  telegram_bot_api_data:
  postgres_data:
  redis_data:
